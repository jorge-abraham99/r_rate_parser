<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set password — Reudan Rate Desk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/ui/styles.css?v=16">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-card" aria-labelledby="setPasswordTitle">
      <div class="login-brand">
        <span class="logo" aria-hidden="true">R</span>
        <span class="brand-name">REUDAN <span>Rate Desk</span></span>
      </div>
      <h1 id="setPasswordTitle">Set your password</h1>
      <p class="login-intro">Choose a password to finish setting up your invitation.</p>
      <div id="setPasswordAlert" class="login-alert" role="alert" hidden></div>
      <form id="setPasswordForm" class="login-form" hidden>
        <label for="newPassword">New password</label>
        <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" minlength="8" required autofocus>
        <label for="confirmPassword">Confirm password</label>
        <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required>
        <button id="setPasswordSubmit" class="primary-button" type="submit">Set password</button>
      </form>
      <p class="login-note">Invitation links are single-use. If this link has expired, contact your Reudan administrator for a new invitation.</p>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.2/dist/umd/supabase.min.js" integrity="sha384-B2duOBIryCXbX4eDE4BdJwtNkQMRQde3o6IsjfPW28E6aH1CYE96hHeZRG3zY56O" crossorigin="anonymous"></script>
  <script src="/ui/auth.js?v=1"></script>
  <script src="/ui/set-password.js?v=1"></script>
</body>
</html>
