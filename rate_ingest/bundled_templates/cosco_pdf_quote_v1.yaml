template_id: cosco_pdf_quote_v1
template_name: COSCO India and Far East PDF Quote v1
provider_name: COSCO
parser_family: cosco_pdf_quote
document_type: ocean_export
file_type: pdf
active: true

match_rules:
  filename_contains:
    - "TUTICORIN"
  required_header_labels:
    - "FREIGHT RATE"
    - "EMERGENCY FUEL SURCHARGE"
    - "INLAND HAULAGE AT LOAD"

cosco_pdf_rules:
  priced_components:
    - freight
    - emergency_fuel_surcharge
    - inland_haulage_at_load

defaults:
  carrier_name: COSCO
  currency_default: USD
  commodity: WASTE PAPER
  all_in_flag: false

validation:
  amount_min: 1
  amount_max: 10000
